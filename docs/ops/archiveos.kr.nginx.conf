server {
    listen 80;
    listen [::]:80;
    server_name archiveos.kr www.archiveos.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://archiveos.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name archiveos.kr;

    ssl_certificate /etc/letsencrypt/live/archiveos.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archiveos.kr/privkey.pem;

    location = /archiveos {
        return 301 /archiveos/;
    }

    location ^~ /archiveos/ {
        rewrite ^/archiveos/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600s;
    }
}
