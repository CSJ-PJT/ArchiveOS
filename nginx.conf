server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The public OCI edge is the trusted source of the original client headers.
    # Preserve them across the reverse SSH hop; local ports remain loopback-only.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Obsidian embedding sync is explicit and can take longer than nginx's
    # default one-minute upstream timeout. Keep the UI request aligned with
    # the backend operation instead of reporting a false gateway failure.
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location = /health {
    proxy_pass http://backend:4000/health;
    proxy_set_header Host $host;
  }

  # Return an explicit not-found response for common secret and diagnostics
  # probes. Without this guard the SPA fallback responds with index.html and a
  # misleading 200 even though no sensitive file was exposed.
  location ~* ^/(?:\.env(?:\.|/|$)|\.git(?:/|$)|actuator/(?:env|configprops|heapdump|logfile)(?:/|$)|swagger(?:-ui)?(?:/|$)|v[23]/api-docs(?:/|$)|phpinfo(?:\.php)?$) {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
