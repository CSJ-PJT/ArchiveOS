plugins {
    id "java"
    id "org.springframework.boot" version "3.5.16"
    id "io.spring.dependency-management" version "1.1.7"
}

group = "com.archiveos"
version = "0.1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springAiVersion = "1.0.9"
}

// Spring AI 1.0.x is aligned with the Spring Boot 3.5 generation. Keep the
// platform BOM intact so Spring Framework, Security, Tomcat, and Micrometer
// receive the mutually compatible security-patched versions managed by Boot.
ext["jackson-bom.version"] = "2.21.4"

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-batch"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.flywaydb:flyway-core"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "com.svix:svix:1.95.2"
    implementation "org.springframework.ai:spring-ai-starter-model-openai"
    implementation "org.springframework.ai:spring-ai-starter-vector-store-pgvector"
    runtimeOnly "org.postgresql:postgresql:42.7.12"
    runtimeOnly "org.flywaydb:flyway-database-postgresql"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

tasks.named("test") {
    useJUnitPlatform()
}
