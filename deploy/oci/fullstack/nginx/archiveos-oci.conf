server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;

  # ArchiveOS keeps its existing backend API contract. The World SSE route is
  # separate because it needs unbuffered long-lived HTTP/1.1 proxying.
  location = /api/world/stream {
    proxy_pass http://backend:4000/api/world/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location = /health {
    proxy_pass http://backend:4000/health;
    proxy_set_header Host $host;
  }

  # The two World data documents must never be served stale. proxy_pass
  # intentionally has no URI suffix so the full sibling route is preserved.
  location = /archive-world-mini/status.json {
    proxy_pass http://archive-world-mini:4190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /archive-world-mini/world-mini-map.json {
    proxy_pass http://archive-world-mini:4190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location ~ ^/archive-world-mini/.*\.map$ {
    return 404;
  }

  location ~ ^/archive-world-mini/assets/ {
    proxy_pass http://archive-world-mini:4190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location ^~ /archive-world-mini/ {
    proxy_pass http://archive-world-mini:4190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
