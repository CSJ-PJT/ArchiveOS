# Include this file in each public ArchiveOS server block after installing
# archiveos-edge-rate-zones.conf in the Nginx http context.
# The limits are deliberately generous for the public portfolio UI while still
# bounding a single source that floods the edge.
limit_req zone=archiveos_public_per_ip burst=120 nodelay;
limit_req_status 429;
limit_conn archiveos_public_conn 40;
limit_conn_status 429;

# Do not let the SPA fallback disguise common secret and diagnostics probes as
# successful page requests. This block returns no sensitive content.
location ~* ^/(?:\.env(?:\.|/|$)|\.git(?:/|$)|actuator/(?:env|configprops|heapdump|logfile)(?:/|$)|swagger(?:-ui)?(?:/|$)|v[23]/api-docs(?:/|$)|phpinfo(?:\.php)?$) {
    access_log off;
    log_not_found off;
    return 404;
}
