# The ArchiveOS tunnel may create only the loopback listeners consumed by the
# edge proxy. It cannot request shells, TTYs, agents, X11, or arbitrary ports.
Match User archiveos-tunnel
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    GatewayPorts no
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:4400 127.0.0.1:4401 127.0.0.1:4402 127.0.0.1:4403
    MaxSessions 0
