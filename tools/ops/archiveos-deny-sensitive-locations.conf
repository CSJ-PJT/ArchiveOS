# Keep common secret and diagnostics probes out of the SPA fallback. The
# application never serves these paths, so an explicit 404 is both safer and
# produces truthful access telemetry.
location ~* ^/(?:\.env(?:\.|/|$)|\.git(?:/|$)|actuator/(?:env|configprops|heapdump|logfile)(?:/|$)|swagger(?:-ui)?(?:/|$)|v[23]/api-docs(?:/|$)|phpinfo(?:\.php)?$) {
    access_log off;
    log_not_found off;
    return 404;
}

